<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3b5640"/></marker>
  </defs>
  <rect width="980" height="560" fill="#fbf7ef"/>
  <!-- user -->
  <rect x="20" y="230" width="130" height="90" rx="14" fill="#fff" stroke="#4f6f52" stroke-width="2"/>
  <text x="85" y="265" text-anchor="middle" font-weight="bold">Umma</text>
  <text x="85" y="285" text-anchor="middle" font-size="12">React + Vite</text>
  <text x="85" y="301" text-anchor="middle" font-size="12">calendar + assistant</text>
  <!-- deterministic -->
  <rect x="200" y="20" width="300" height="250" rx="14" fill="#eef3e9" stroke="#4f6f52" stroke-width="2"/>
  <text x="350" y="45" text-anchor="middle" font-weight="bold">Deterministic code (FastAPI)</text>
  <text x="215" y="75">• Discovery: YouTube, articles, pasted threads</text>
  <text x="215" y="98">• Existing captions (youtube-transcript-api)</text>
  <text x="215" y="121">• Pasted / .srt / .vtt transcript parser</text>
  <text x="215" y="144">• Frames: ffmpeg from uploaded file only,</text>
  <text x="230" y="162">sharpest of 4 nearby frames (Pillow)</text>
  <text x="215" y="185">• SQLite + FTS5 search (synonyms)</text>
  <text x="215" y="208">• Caching keyed on content + versions</text>
  <text x="215" y="231">• Meds, dose log, appointments, .ics</text>
  <text x="215" y="254">• Review queue, budget, consent, redaction</text>
  <!-- agent -->
  <rect x="560" y="20" width="400" height="330" rx="14" fill="#fff" stroke="#7b4c8e" stroke-width="2"/>
  <text x="760" y="45" text-anchor="middle" font-weight="bold">One main agent: UmmaCare (PydanticAI)</text>
  <text x="760" y="64" text-anchor="middle" font-size="12">gpt-6-luna via Portkey · shared rule set · validated outputs</text>
  <rect x="575" y="80" width="180" height="120" rx="10" fill="#f6f1fa" stroke="#b79cc6"/>
  <text x="585" y="100" font-weight="bold" font-size="13">Structured skills</text>
  <text x="585" y="120" font-size="12">source → key takeaways</text>
  <text x="585" y="138" font-size="12">connection generation</text>
  <text x="585" y="156" font-size="12">+ reference claim checks</text>
  <text x="585" y="174" font-size="12">image-note reading</text>
  <text x="585" y="192" font-size="12">documents · label · brief</text>
  <rect x="765" y="80" width="185" height="206" rx="10" fill="#f6f1fa" stroke="#b79cc6"/>
  <text x="775" y="100" font-weight="bold" font-size="13">Chat tools</text>
  <text x="775" y="120" font-size="12">search_my_records</text>
  <text x="775" y="138" font-size="12">search_discoveries</text>
  <text x="775" y="156" font-size="12">search_medical_references</text>
  <text x="775" y="174" font-size="12">find_conflicts · trace_idea</text>
  <text x="775" y="192" font-size="12">list_recent_symptoms</text>
  <text x="775" y="210" font-size="12">list_open_questions</text>
  <text x="775" y="228" font-size="12">list_appointments</text>
  <text x="775" y="246" font-size="12" fill="#9a4a2a">propose_appointment_request*</text>
  <text x="775" y="264" font-size="12" fill="#9a4a2a">propose_order*</text>
  <text x="775" y="280" font-size="12" fill="#9a4a2a">propose_question*</text>
  <text x="575" y="225" font-size="12">Validators reject invented record ids,</text>
  <text x="575" y="242" font-size="12">passage ids, segment numbers, doses →</text>
  <text x="575" y="259" font-size="12">bounded retry (≤6 requests, 60k tokens)</text>
  <text x="575" y="295" font-size="12" fill="#9a4a2a">* proposals only: written to a review queue;</text>
  <text x="575" y="312" font-size="12" fill="#9a4a2a">no tool edits meds, confirms visits, or buys</text>
  <text x="575" y="335" font-size="12">Transcripts/notes wrapped as &lt;untrusted&gt; data</text>
  <!-- data -->
  <rect x="200" y="320" width="300" height="110" rx="14" fill="#e5edf3" stroke="#2f5674" stroke-width="2"/>
  <text x="350" y="345" text-anchor="middle" font-weight="bold">Local data (single user)</text>
  <text x="215" y="370" font-size="13">ummacare.db: notes + revisions, symptoms,</text>
  <text x="215" y="389" font-size="13">videos, moments, connections, questions,</text>
  <text x="215" y="408" font-size="13">meds, orders, documents, usage (numbers)</text>
  <rect x="560" y="380" width="400" height="80" rx="14" fill="#e5edf3" stroke="#2f5674" stroke-width="2"/>
  <text x="760" y="405" text-anchor="middle" font-weight="bold">Curated references (21 passages)</text>
  <text x="760" y="426" text-anchor="middle" font-size="13">NIDDK Hashimoto's · NIAMS Sjögren's</text>
  <text x="760" y="445" text-anchor="middle" font-size="12">URL, publisher, reviewed date, retrieved 2026-10-26, ids</text>
  <!-- review queue -->
  <rect x="20" y="420" width="160" height="100" rx="14" fill="#fbf0d4" stroke="#7a5a00" stroke-width="2"/>
  <text x="100" y="448" text-anchor="middle" font-weight="bold">Human review</text>
  <text x="100" y="470" text-anchor="middle" font-size="12">approve / reject</text>
  <text x="100" y="488" text-anchor="middle" font-size="12">AI proposals,</text>
  <text x="100" y="506" text-anchor="middle" font-size="12">AI-read notes &amp; labels</text>
  <!-- arrows -->
  <line x1="150" y1="260" x2="198" y2="200" stroke="#3b5640" stroke-width="2" marker-end="url(#a)"/>
  <line x1="500" y1="140" x2="558" y2="140" stroke="#3b5640" stroke-width="2" marker-end="url(#a)"/>
  <line x1="558" y1="170" x2="502" y2="170" stroke="#3b5640" stroke-width="2" marker-end="url(#a)"/>
  <line x1="350" y1="270" x2="350" y2="318" stroke="#3b5640" stroke-width="2" marker-end="url(#a)"/>
  <line x1="760" y1="350" x2="760" y2="378" stroke="#3b5640" stroke-width="2" marker-end="url(#a)"/>
  <line x1="560" y1="300" x2="502" y2="360" stroke="#3b5640" stroke-width="2" marker-end="url(#a)"/>
  <line x1="85" y1="320" x2="85" y2="418" stroke="#7a5a00" stroke-width="2" marker-end="url(#a)"/>
  <line x1="180" y1="470" x2="198" y2="420" stroke="#7a5a00" stroke-width="2" marker-end="url(#a)"/>
  <text x="510" y="130" font-size="11">calls</text>
  <text x="200" y="545" font-size="12" fill="#5a574e">Consent gate + daily $ budget run before every model call. Health text never goes into telemetry.</text>
</svg>
